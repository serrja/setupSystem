[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system"
version = "0.7.0.dev0"
description = "Plugin host for inspecting, planning and applying workstation configuration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8.1,<3",
    "textual>=2.1,<7",
    "tomlkit>=0.13,<1",
    "platformdirs>=4,<5",
    "setup-system-sdk>=3,<4",
    "anyio>=4.8,<5",
    "tenacity>=9,<10",
    "packaging>=24,<27",
    "pyyaml>=6,<7",
    "jinja2>=3.1,<4",
    "aiofiles>=24,<26",
    "aiosqlite>=0.20,<1",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "alembic>=1.13.2,<2",
    "keyring>=25,<27",
    "typer>=0.15.2,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
setup-system = "setup_system.entrypoint:main"

[dependency-groups]
dev = [
    "packaging>=25,<27",
    "hatchling>=1.27,<2",
    "mypy>=2.3,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.16.4,<1",
    "types-pyyaml>=6,<7",
    "shellcheck-py>=0.11.0.1",
    "pytest-subprocess>=1.5,<2",
    "pytest-xdist>=3.6,<4",
    "types-aiofiles>=25.1.0.20261107",
]

[tool.uv.workspace]
members = ["sdk", "plugins/*"]

[tool.uv.sources]
setup-system-sdk = { workspace = true }

[tool.hatch.build]
exclude = [".aws", ".aws/**", ".serena", ".serena/**", ".agents", ".agents/**", ".codex", ".codex/**", ".local", ".local/**", "backups", "backups/**", ".env", ".env.*", "/core.[0-9]*", "/.coverage", "/.coverage.*", ".vscode", ".vscode/**"]

[tool.hatch.build.targets.sdist]
include = ["/src/setup_system", "/migrations", "/alembic.ini", "/README.md", "/LICENSE.md", "/THIRD_PARTY_NOTICES.md"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.hatch.build.targets.wheel]
packages = ["src/setup_system"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "setup_system/_migrations"

[tool.uv]
# pytest-subprocess intercepts the asyncio subprocess API used by AnyIO 4.9.
constraint-dependencies = ["anyio==4.9.0"]
# Pin the isolated build backend and its full dependency closure to uv.lock versions.
build-constraint-dependencies = [
    "hatchling==1.33.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
# This snapshot retains its canonical owner's 88-column formatting; Make checks it separately.
exclude = ["docker/release.py", "docker/python_release.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "sdk/src"]
explicit_package_bases = true
files = ["src", "sdk/src", "migrations", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
