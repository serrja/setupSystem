[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system"
version = "0.2.0.dev2"
description = "Debian workstation setup and portable user configuration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["typer>=0.27.2,<1", "pydantic>=2.12,<3", "copier==9.17.2", "pyyaml>=6,<7", "plumbum>=2,<3", "packaging>=25,<27"]

[project.scripts]
setup-system = "setup_system.cli.main:app"

[dependency-groups]
dev = ["mypy>=2.3,<3", "pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.16.4,<1", "types-pyyaml>=6,<7"]

[tool.hatch.build]
exclude = [".aws", ".aws/**", ".serena", ".serena/**", ".agents", ".agents/**", ".codex", ".codex/**", ".local", ".local/**", "backups", "backups/**", ".env", ".env.*", "/core.[0-9]*", "/.coverage", "/.coverage.*", ".vscode", ".vscode/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/setup_system"]

[tool.hatch.build.targets.wheel.force-include]
assets = "setup_system/assets"
manifests = "setup_system/manifests"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
# This snapshot retains its canonical owner's 88-column formatting; Make checks it separately.
exclude = ["docker/release.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/setup_system", "bootstrap.py"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
markers = ["unit: isolated unit checks", "integration: isolated system integration", "e2e: desktop checks"]

[tool.coverage.run]
branch = true
source = ["setup_system", "bootstrap"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 0
precision = 2
show_missing = true
include_namespace_packages = true

[tool.coverage.json]
output = "coverage/python/coverage.json"

[tool.coverage.xml]
output = "coverage/python/coverage.xml"
