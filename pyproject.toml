[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system"
version = "0.6.0.dev0"
description = "Debian workstation setup and portable user configuration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8.1,<3",
    "textual>=2.1,<7",
    "tomlkit>=0.13,<1",
    "platformdirs>=4,<5",
    "pexpect>=4.9,<5",
    "packaging>=24,<27",
    "pyyaml>=6,<7",
    "jinja2>=3.1,<4",
    "ansible-core>=2.18,<3",
    "aiofiles>=24,<26",
    "typer>=0.15.2,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
setup-system = "setup_system.entrypoint:main"

[dependency-groups]
dev = [
    "packaging>=25,<27",
    "hatchling>=1.27,<2",
    "mypy>=2.3,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16.4,<1",
    "types-pyyaml>=6,<7",
    "shellcheck-py>=0.11.0.1",
    "ansible-lint>=26.11.0",
    "copier==9.17.2",
    "types-aiofiles>=25.1.0.20261107",
]

[tool.hatch.build]
exclude = [".aws", ".aws/**", ".serena", ".serena/**", ".agents", ".agents/**", ".codex", ".codex/**", ".local", ".local/**", "backups", "backups/**", ".env", ".env.*", "/core.[0-9]*", "/.coverage", "/.coverage.*", ".vscode", ".vscode/**"]

[tool.hatch.build.targets.sdist]
# Ship only runtime inputs; local reports/caches must never enter a source release.
include = ["/docs", "/src/setup_system", "/assets", "/Makefile", "/mk", "/libexec", "/config", "/ansible.cfg", "/ansible", "/debian", "/README.md", "/LICENSE.md", "/THIRD_PARTY_NOTICES.md", "/install.sh", "/uv.lock"]
exclude = ["**/__pycache__", "**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[tool.hatch.build.targets.wheel]
packages = ["src/setup_system"]

[tool.hatch.build.targets.wheel.force-include]
"Makefile" = "setup_system/bundle/Makefile"
"install.sh" = "setup_system/bundle/install.sh"
"docs" = "setup_system/bundle/docs"
"mk" = "setup_system/bundle/mk"
"libexec" = "setup_system/bundle/libexec"
"assets" = "setup_system/bundle/assets"
"config" = "setup_system/bundle/config"
"ansible" = "setup_system/bundle/ansible"
"ansible.cfg" = "setup_system/bundle/ansible.cfg"

[tool.uv]
# Pin the isolated build backend and its full dependency closure to uv.lock versions.
build-constraint-dependencies = [
    "hatchling==1.33.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
# This snapshot retains its canonical owner's 88-column formatting; Make checks it separately.
exclude = ["docker/release.py", "docker/python_release.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
explicit_package_bases = true
files = ["src/setup_system", "assets/hyprland/panel.py", "assets/login/login_session.py", "ansible", "libexec/dpkg_lock.py", "debian/build.py", "docker/coverage_report.py", "docker/release_target.py", "docker/verify_native.py", "docker/settings_reference.py", "docker/verify-installed.py", "docker/installed_smoke.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["unit: isolated unit checks", "integration: isolated system integration", "e2e: desktop checks"]

[tool.coverage.run]
branch = true
source = ["setup_system", "ansible", "assets/login", "assets/hyprland", "libexec", "debian", "docker"]
patch = ["subprocess"]
omit = ["*/docker/python_release.py", "*/docker/release.py"]

[tool.coverage.report]
fail_under = 75
precision = 2
show_missing = true
include_namespace_packages = true

[tool.coverage.json]
output = "coverage/python/coverage.json"

[tool.coverage.xml]
output = "coverage/python/coverage.xml"
