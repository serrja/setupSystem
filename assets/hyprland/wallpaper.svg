    <radialGradient id="glow"><stop stop-color="@{ render_ctx.green }@" stop-opacity=".3"/><stop offset="1" stop-color="@{ render_ctx.green }@" stop-opacity="0"/></radialGradient>
    <linearGradient id="ridge" x2="1" y2=".4"><stop stop-color="@{ render_ctx.surface1 }@"/><stop offset="1" stop-color="@{ render_ctx.surface2 }@"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#night)"/>
