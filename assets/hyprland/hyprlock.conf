background {
    color = rgba({{ base_hex }}ff)
}
label {
    text = $TIME
    font_family = @PRIMARY_FAMILY@
    font_size = 80
    color = rgba({{ text_hex }}ff)
    position = 0, 150
    halign = center
    valign = center
}
label {
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_family = @PRIMARY_FAMILY@
    font_size = 20
    color = rgba({{ subtext1_hex }}ff)
    position = 0, 90
    halign = center
    valign = center
}
input-field {
    size = 320, 64
    position = 0, -30
    font_family = @PRIMARY_FAMILY@
    outer_color = rgba({{ green_hex }}ff)
    inner_color = rgba({{ surface0_hex }}ff)
    font_color = rgba({{ text_hex }}ff)
    outline_thickness = 2
    rounding = 16
    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = Authentication failed
}
label {
    text = $LAYOUT[en,ru]
    font_family = @PRIMARY_FAMILY@
    font_size = 16
    color = rgba({{ subtext0_hex }}ff)
    onclick = hyprctl switchxkblayout all next
    position = 0, -100
    halign = center
    valign = center
}
