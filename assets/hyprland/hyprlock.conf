background {
    color = rgba(1e1e2eff)
}
label {
    text = $TIME
    font_family = @PRIMARY_FAMILY@
    font_size = 80
    color = rgba(cdd6f4ff)
    position = 0, 150
    halign = center
    valign = center
}
label {
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_family = @PRIMARY_FAMILY@
    font_size = 20
    color = rgba(bac2deff)
    position = 0, 90
    halign = center
    valign = center
}
input-field {
    size = 320, 64
    position = 0, -30
    font_family = @PRIMARY_FAMILY@
    outer_color = rgba(89b4faff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    outline_thickness = 2
    rounding = 16
    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = Authentication failed
}
label {
    text = $LAYOUT[en,ru]
    font_family = @PRIMARY_FAMILY@
    font_size = 16
    color = rgba(a6adc8ff)
    onclick = hyprctl switchxkblayout all next
    position = 0, -100
    halign = center
    valign = center
}
