background {
    color = rgb(@{ render_ctx.auth_screen.background[1:] }@)
}
shape {
    size = @{ render_ctx.auth_screen.card_width }@, @{ render_ctx.auth_screen.card_height }@
    color = rgb(@{ render_ctx.auth_screen.card[1:] }@)
    border_color = rgb(@{ render_ctx.auth_screen.accent[1:] }@)
    border_size = @{ render_ctx.auth_screen.border }@
    rounding = @{ render_ctx.auth_screen.radius }@
    halign = center
    valign = center
    zindex = -1
}
label {
    text = $USER
    font_family = @{ render_ctx.auth_screen.font }@
    font_size = @{ render_ctx.auth_screen.font_size }@
    color = rgb(@{ render_ctx.auth_screen.foreground[1:] }@)
    position = 0, @{ render_ctx.auth_screen.input_height }@
    halign = center
    valign = center
}
input-field {
    size = @{ render_ctx.auth_screen.input_width }@, @{ render_ctx.auth_screen.input_height }@
    position = 0, 0
    font_family = @{ render_ctx.auth_screen.font }@
    outer_color = rgb(@{ render_ctx.auth_screen.accent[1:] }@)
    inner_color = rgb(@{ render_ctx.auth_screen.input[1:] }@)
    font_color = rgb(@{ render_ctx.auth_screen.foreground[1:] }@)
    fail_color = rgb(@{ render_ctx.auth_screen.error[1:] }@)
    outline_thickness = @{ render_ctx.auth_screen.border }@
    rounding = @{ render_ctx.auth_screen.radius }@
    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = Authentication failed
}
label {
    text = $LAYOUT
    font_family = @{ render_ctx.auth_screen.font }@
    font_size = @{ render_ctx.auth_screen.font_size }@
    color = rgb(@{ render_ctx.auth_screen.foreground[1:] }@)
    onclick = hyprctl switchxkblayout all next
    position = 0, -@{ render_ctx.auth_screen.input_height }@
    halign = center
    valign = center
}
