[main]
font=@{ render_ctx.fonts.family }@:size=@{ render_ctx.fonts.terminal_size }@,@{ render_ctx.fonts.emoji_fallback }@:size=@{ render_ctx.fonts.terminal_size }@
pad=12x12
[colors]
background=@{ render_ctx.base_hex }@
foreground=@{ render_ctx.text_hex }@
regular0=@{ render_ctx.surface1_hex }@
regular1=@{ render_ctx.red_hex }@
regular2=@{ render_ctx.green_hex }@
regular3=@{ render_ctx.yellow_hex }@
regular4=@{ render_ctx.green_hex }@
regular5=@{ render_ctx.mauve_hex }@
regular6=@{ render_ctx.teal_hex }@
regular7=@{ render_ctx.subtext1_hex }@
bright0=@{ render_ctx.surface2_hex }@
bright1=@{ render_ctx.red_hex }@
bright2=@{ render_ctx.green_hex }@
bright3=@{ render_ctx.yellow_hex }@
bright4=@{ render_ctx.green_hex }@
bright5=@{ render_ctx.mauve_hex }@
bright6=@{ render_ctx.teal_hex }@
bright7=@{ render_ctx.subtext0_hex }@
