<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Rendered by setupSystem from manifests/fonts.toml; fallback never prepends to ordinary text. -->
  <alias><family>sans-serif</family><prefer><family>@{ fonts.family }@</family></prefer></alias>
  <alias><family>serif</family><prefer><family>@{ fonts.family }@</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>@{ fonts.family }@</family></prefer></alias>
  <alias binding="strong"><family>@{ fonts.family }@</family><accept><family>@{ fonts.emoji_fallback }@</family></accept></alias>
  <alias><family>emoji</family><prefer><family>@{ fonts.emoji_fallback }@</family></prefer></alias>
</fontconfig>
