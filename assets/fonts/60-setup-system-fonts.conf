<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Rendered by setupSystem from manifests/fonts.toml; fallback never prepends to ordinary text. -->
  <alias><family>sans-serif</family><prefer><family>@PRIMARY_FAMILY@</family></prefer></alias>
  <alias><family>serif</family><prefer><family>@PRIMARY_FAMILY@</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>@PRIMARY_FAMILY@</family></prefer></alias>
  <alias binding="strong"><family>@PRIMARY_FAMILY@</family><accept><family>@EMOJI_FAMILY@</family></accept></alias>
  <alias><family>emoji</family><prefer><family>@EMOJI_FAMILY@</family></prefer></alias>
</fontconfig>
