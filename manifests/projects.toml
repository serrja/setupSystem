# This is the sole catalog for owned checkout locations. Paths are literal $HOME
# references, not shell expressions. A declared destination does not create a repo.
schemaVersion = 1
projectsRoot = "$HOME/Projects"
ownerGroups = ["serrja", "pokerlost"]

[[project]]
id = "serrja/setupSystem"
legacyPath = "$HOME/setupSystem"
origin = "git@github.com:serrja/setupSystem.git"
state = "existing"

