# Trusted component selections. Only named, built-in handlers can execute.
[neovim]
kind = "app"
title = "Neovim, clipboard and editor integration"
handler = "neovim"
packages = ["git", "fzf", "ripgrep", "wl-clipboard", "build-essential", "curl", "tar", "unzip"]

[developer_tools]
kind = "app"
title = "Git, GitHub CLI and shell tools"
handler = "apt"
packages = ["git", "gh", "zsh", "ripgrep", "fzf"]

[codex]
kind = "app"
title = "Codex CLI"
handler = "codex"

[chatgpt]
kind = "app"
title = "Official ChatGPT Desktop"
handler = "catalog_deb"

[firefox]
kind = "app"
title = "Firefox ESR and uBlock Origin"
handler = "firefox"
packages = ["firefox-esr"]

[happ]
kind = "app"
title = "Happ"
handler = "happ"

[obsidian]
kind = "optional"
title = "Obsidian"
handler = "catalog_deb"

[obsidian.artifacts.amd64]
url = "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.15.1/obsidian_1.15.1_amd64.deb"
version = "1.15.1"
sha256 = "f77b6dfc8c040214f2febad2b1b9b051b6a838a47b0f4fb90a31cfcb79b8fcec"

[telegram]
kind = "optional"
title = "Telegram Desktop"
handler = "apt"
packages = ["telegram-desktop"]

[docker]
kind = "optional"
title = "Docker Engine and CLI (Debian packages)"
handler = "apt"
packages = ["docker.io", "docker-cli"]

[libreoffice]
kind = "optional"
title = "LibreOffice"
handler = "apt"
packages = ["libreoffice"]

[python]
kind = "language"
title = "Python · Ruff and basedpyright"
handler = "python_tools"

[typescript_vue]
kind = "language"
title = "TypeScript and Vue"
handler = "language"
packages = ["nodejs", "npm"]

[dart_flutter]
kind = "language"
title = "Dart and Flutter SDK (several GiB on first install)"
packages = ["git", "curl", "unzip", "xz-utils"]
handler = "language"

[cpp]
kind = "language"
title = "C++ · clangd and clang-format"
handler = "language"
packages = ["clangd", "clang-format"]

