[chatgpt]
kind = "user-app"
purpose = "Official ChatGPT desktop app"
publisher = "OpenAI"
source = "https://learn.chatgpt.com/docs/linux/linux-app"
method = "manual-deb"
supportedDebianVersions = ["13"]
detect = "chatgpt"
package = "chatgpt"
privilege = "sudo apt install local .deb"
data = "existing application profile remains in place"

[happ]
kind = "user-app"
purpose = "Desktop proxy client and native routing profiles"
publisher = "FlyFrog LLC"
source = "https://github.com/Happ-proxy/happ-desktop/releases"
method = "pinned-official-deb"
supportedDebianVersions = ["12", "13"]
detect = "happ"
package = "happ"
privilege = "targeted sudo only for absent verified Debian package"
data = "subscriptions and routing stay private in Happ"

[obsidian]
kind = "user-app"
purpose = "Local knowledge vault"
publisher = "Obsidian"
source = "https://obsidian.md/download"
method = "existing-snap"
detect = "obsidian"
package = "obsidian"
privilege = "none for audit"
data = "vault and Snap data remain in place"

[telegram]
kind = "user-app"
purpose = "Messaging"
publisher = "Telegram FZ-LLC"
source = "https://snapcraft.io/telegram-desktop"
method = "existing-snap"
detect = "telegram-desktop"
package = "telegram-desktop"
privilege = "none for audit"
data = "Snap profile remains in place"

[docker]
kind = "dev-tool"
purpose = "Container build and Compose"
publisher = "Docker Inc."
source = "https://docs.docker.com/engine/install/debian/"
method = "official-apt-repository"
supportedDebianVersions = ["12", "13"]
detect = "docker"
package = "docker-ce"
privilege = "targeted sudo"
data = "containers, images, volumes and contexts must be preserved"

[zsh]
kind = "system-dependency"
purpose = "Interactive shell"
publisher = "Debian archive"
source = "https://packages.debian.org/stable/zsh"
method = "debian-apt-or-existing-user-install"
supportedDebianVersions = ["12", "13"]
detect = "zsh"
package = "zsh"
privilege = "targeted sudo if absent"
data = "history and rc stay in home"

[spotify]
kind = "user-app"
purpose = "Music"
publisher = "Spotify"
source = "https://snapcraft.io/spotify"
method = "existing-snap"
detect = "spotify"
package = "spotify"
privilege = "none for audit"
data = "existing profile remains in place"

[libreoffice]
kind = "user-app"
purpose = "Office documents"
publisher = "The Document Foundation"
source = "https://snapcraft.io/libreoffice"
method = "existing-snap"
detect = "libreoffice"
package = "libreoffice"
privilege = "none for audit"
data = "existing profile remains in place"

[neovim]
kind = "dev-tool"
purpose = "Editor"
publisher = "Neovim"
source = "https://github.com/neovim/neovim/releases"
method = "pinned-official-archive-via-terminalDev"
supportedDebianVersions = ["12", "13"]
detect = "nvim"
package = "nvim"
privilege = "none for audit"
data = "editor configuration remains in place"
