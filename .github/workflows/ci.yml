name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: ./.github/actions/actionlint
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore installed-test graph; execution remains fresh
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.quality
          target: installed-test
          load: true
          tags: setupsystem:installed
          cache-from: type=gha,scope=${{ github.repository_id }}-installed-test-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-installed-test-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - name: Mandatory checks, canonical distributions and installed acceptance
        run: make ci-local
      - name: Numeric advisory coverage table
        if: always()
        run: test ! -f coverage/summary.md || cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: setupSystem-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            coverage/
            dist/
          retention-days: 14
          if-no-files-found: error
  required:
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          VERIFY: '${{ needs.verify.result }}'
        run: |
          set -euo pipefail
          test "$VERIFY" = success
