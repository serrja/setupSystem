name: CI
on:
  push:
    branches: [test, dev, main]
  pull_request:
    branches: [test, dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    outputs:
      package-name: ${{ steps.release-target.outputs.package-name }}
      version-target: ${{ steps.release-target.outputs.version-target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/actionlint
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: '0.12.15'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare the locked native toolchain
        run: |
          uv python install 3.14.7
          uv sync --locked --all-groups --python 3.14.7
      - name: Mandatory checks, canonical distributions and outside-installed acceptance
        run: make native-ci
      - name: Read release identity from canonical native metadata
        id: release-target
        run: |
          uv run --locked python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          from packaging.utils import canonicalize_name
          from packaging.version import Version
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          print("package-name=" + canonicalize_name(project["name"]))
          print("version-target=" + Version(project["version"]).base_version)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: setupSystem-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/
          retention-days: 14
          if-no-files-found: error
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: '0.12.15'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify the declared minimum Python runtime
        run: |
          uv python install 3.12
          uv sync --locked --all-groups --python 3.12
          make native-check
  required:
    outputs:
      package-name: ${{ needs.verify.outputs.package-name }}
      version-target: ${{ needs.verify.outputs.version-target }}
    if: always()
    needs: [verify, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          VERIFY: ${{ needs.verify.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
        run: |
          set -euo pipefail
          test "$VERIFY" = success
          test "$COMPATIBILITY" = success
  release-allocation:
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    needs: required
    permissions:
      contents: write
      actions: read
    uses: pokerlost/.github/.github/workflows/python-allocate.yml@e5cac33af228224af9deaef308e39c1b9f788033
    with:
      provider-ref: e5cac33af228224af9deaef308e39c1b9f788033
      schema-version: h02-python/v1
      source-workflow: .github/workflows/ci.yml
      preflight-gate: required
      builder-job: release-builder
      package-name: ${{ needs.required.outputs.package-name }}
      version-target: ${{ needs.required.outputs.version-target }}
      wheel-tags: '["py3-none-any"]'
  release-builder:
    name: release-builder
    needs: [required, release-allocation]
    if: needs.release-allocation.outputs.build-required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-allocation.outputs.source-sha }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pokerlost/.github
          ref: e5cac33af228224af9deaef308e39c1b9f788033
          persist-credentials: false
          path: provider
      - name: Keep the native environment and dependency cache outside source
        run: |
          printf 'UV_PROJECT_ENVIRONMENT=%s/h02-native-env\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'UV_CACHE_DIR=%s/h02-uv-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: '0.12.15'
          enable-cache: true
          cache-dependency-glob: source/uv.lock
      - name: Prepare the existing locked native toolchain without installing source
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN
          uv python install 3.14.7
          uv sync --locked --all-groups --no-install-project --python 3.14.7
      - name: Build the allocated version from an isolated exact-source export
        env:
          ALLOCATION_JSON: ${{ needs.release-allocation.outputs.allocation }}
          ALLOCATION_SHA256: ${{ needs.release-allocation.outputs.allocation-sha256 }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          (Path(os.environ["RUNNER_TEMP"]) / "allocation.json").write_text(os.environ["ALLOCATION_JSON"])
          (Path(os.environ["RUNNER_TEMP"]) / "source-pyproject.toml").write_bytes(Path("pyproject.toml").read_bytes())
          PYTHON
          "$UV_PROJECT_ENVIRONMENT/bin/python" docker/python_release.py build \
            --allocation "$RUNNER_TEMP/allocation.json" --allocation-sha256 "$ALLOCATION_SHA256" \
            --provider-ref e5cac33af228224af9deaef308e39c1b9f788033 \
            --destination "$RUNNER_TEMP/h02-source" --output "$RUNNER_TEMP/h02-dist" \
            --evidence "$RUNNER_TEMP/build-tool.json" --source-pyproject "$RUNNER_TEMP/source-pyproject.toml"
      - name: Independently inspect native archive metadata
        env:
          VERSION_TARGET: ${{ needs.required.outputs.version-target }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN
          "$UV_PROJECT_ENVIRONMENT/bin/python" ../provider/scripts/python_artifacts.py verify \
            --allocation "$RUNNER_TEMP/allocation.json" --directory "$RUNNER_TEMP/h02-dist" \
            --source-pyproject "$RUNNER_TEMP/source-pyproject.toml" --version-target "$VERSION_TARGET" \
            > "$RUNNER_TEMP/native-metadata.json"
      - name: Accept the allocated wheel outside the source checkout
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/installed-requirements.txt"
          uv venv --python 3.14.7 "$RUNNER_TEMP/h02-installed"
          uv pip sync --require-hashes --python "$RUNNER_TEMP/h02-installed/bin/python" "$RUNNER_TEMP/installed-requirements.txt"
          uv pip install --no-deps --no-index --python "$RUNNER_TEMP/h02-installed/bin/python" "$RUNNER_TEMP/h02-dist/"*.whl
          mkdir "$RUNNER_TEMP/h02-smoke"
          cp "$RUNNER_TEMP/h02-source/pyproject.toml" "$RUNNER_TEMP/h02-smoke/pyproject.toml"
          export PATH="$RUNNER_TEMP/h02-installed/bin:$PATH"
          cd "$RUNNER_TEMP/h02-smoke"
          "$RUNNER_TEMP/h02-installed/bin/python" -I -B "$GITHUB_WORKSPACE/source/docker/verify-installed.py" \
            --wheel "$RUNNER_TEMP/h02-dist/"*.whl
      - name: Record measured tools, original allocation and actual builder job identity
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOCATION_SHA256: ${{ needs.release-allocation.outputs.allocation-sha256 }}
        run: |
          set -euo pipefail
          job_id="$(gh api --hostname github.com --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "release-builder") | .id')"
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN
          "$UV_PROJECT_ENVIRONMENT/bin/python" docker/python_release.py receipt \
            --allocation "$RUNNER_TEMP/allocation.json" --allocation-sha256 "$ALLOCATION_SHA256" \
            --metadata "$RUNNER_TEMP/native-metadata.json" --build-evidence "$RUNNER_TEMP/build-tool.json" \
            --job-id "$job_id" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/h02-dist/python-build-receipt.json"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/h02-dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: h02-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h02-dist/*
          if-no-files-found: error
          compression-level: 0
  release-publication:
    needs: [required, release-allocation, release-builder]
    if: >-
      always() && needs.required.result == 'success' && needs.release-allocation.result == 'success' &&
      (needs.release-builder.result == 'success' ||
      (needs.release-builder.result == 'skipped' && needs.release-allocation.outputs.build-required == 'false'))
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: pokerlost/.github/.github/workflows/python-publish.yml@e5cac33af228224af9deaef308e39c1b9f788033
    with:
      provider-ref: e5cac33af228224af9deaef308e39c1b9f788033
      schema-version: h02-python/v1
      source-workflow: .github/workflows/ci.yml
      preflight-gate: required
      builder-job: release-builder
      package-name: ${{ needs.required.outputs.package-name }}
      version-target: ${{ needs.required.outputs.version-target }}
      wheel-tags: '["py3-none-any"]'
      allocation: ${{ needs.release-allocation.outputs.allocation }}
      artifact-id: ${{ needs.release-allocation.outputs.artifact-id || needs.release-builder.outputs.artifact-id }}
