name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # The hosted runner is only the host; all project commands run in Debian.
    container: python:3.14.7-slim-bookworm@sha256:82bc3c539b8813ada9d68c63b40158fa002f7f33de9bf3312a3dfdc0620dff56
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Install Git for relocation fixtures
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14
      - run: uv lock --check
      - run: uv sync --locked --python 3.14
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked python -m compileall -q bootstrap.py src
      - run: python3 bootstrap.py --help
      - run: python3 bootstrap.py plan
      - run: uv build --wheel --sdist
      - name: Fresh installed wheel outside the checkout
        run: |
          set -eu
          uv venv "$RUNNER_TEMP/setup-wheel" --python 3.14
          uv pip install --python "$RUNNER_TEMP/setup-wheel/bin/python" dist/setup_system-*.whl
          EXPECTED_SETUP_VERSION="$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          export EXPECTED_SETUP_VERSION
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/setup-wheel/bin/setup-system" --help
          "$RUNNER_TEMP/setup-wheel/bin/python" -c "from importlib.metadata import version; import os; from setup_system.application.project_layout import load_layout; from pathlib import Path; import setup_system; root=Path(setup_system.__file__).parent; assert version('setup-system')==os.environ['EXPECTED_SETUP_VERSION']; assert any(p.id=='pokerlost/platformInfra' for p in load_layout(root).projects)"
      - run: uv run --locked pytest --cov --cov-report=term-missing --cov-report=json --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: setup-checks-${{ github.sha }}
          path: |
            coverage/
            dist/
          retention-days: 14
          if-no-files-found: error
