name: Plugin releases
on:
  workflow_call:
    inputs:
      version:
        description: Stable version allocated by the shared release provider
        required: true
        type: string

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      owners: ${{ steps.owners.outputs.owners }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: owners
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          owners = sorted(p.parents[1].name for p in Path("plugins").glob("*/ci/release"))
          if not all(re.fullmatch(r"[a-z][a-z0-9_-]*", owner) for owner in owners):
              raise ValueError("Invalid plugin path")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("owners=" + json.dumps(owners), file=output)

  build:
    needs: discover
    strategy:
      matrix:
        owner: ${{ fromJSON(needs.discover.outputs.owners) }}
    if: needs.discover.outputs.owners != '[]' && github.repository == 'serrja/setupSystem' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: '0.12.15'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build package-owned artifacts
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ matrix.owner }}
          GH_TOKEN: ${{ github.token }}
        run: bash "plugins/$OWNER/ci/release" build "$VERSION" "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/subjects.sha256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        id: proof
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256
          create-storage-record: false
      - name: Save the signed bundle alongside the package
        env:
          BUNDLE: ${{ steps.proof.outputs.bundle-path }}
          VERSION: ${{ inputs.version }}
          OWNER: ${{ matrix.owner }}
        run: bash "plugins/$OWNER/ci/release" bundle "$VERSION" "$RUNNER_TEMP/artifacts" "$BUNDLE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: archive
        with:
          name: plugin-${{ matrix.owner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [build, discover]
    strategy:
      matrix:
        owner: ${{ fromJSON(needs.discover.outputs.owners) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      attestations: read
    concurrency:
      group: publish-${{ matrix.owner }}-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugin-${{ matrix.owner }}-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts
      - name: Verify and publish the package-owned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          OWNER: ${{ matrix.owner }}
        run: bash "plugins/$OWNER/ci/release" publish "$VERSION" "$RUNNER_TEMP/artifacts"
