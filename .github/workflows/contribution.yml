name: Contribution
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  contribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check naming without executing or checking out PR code
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          LEGACY_BRANCH: ${{ vars.LEGACY_PUBLISHED_BRANCH }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          types = r'(?:feat|fix|test|refactor|docs|build|ci|chore|perf|style|revert)'
          branch = os.environ['HEAD_REF']
          legacy = os.environ['LEGACY_BRANCH']
          assert (legacy and branch == legacy) or re.fullmatch(types + r'/[a-z][A-Za-z0-9]*', branch), 'New branches use type/shortCamelCase; preserve only the explicitly recorded published legacy branch'
          assert re.fullmatch(types + r'\([a-z][a-z0-9-]*\)!?: [^\r\n]+', os.environ['PR_TITLE']), 'Use type(scope): intent in the PR title'
          PYTHON
