name: Debian package
on:
  workflow_call:
    inputs:
      version:
        description: Stable version allocated by the shared release provider
        required: true
        type: string

permissions: {}

jobs:
  build:
    if: github.repository == 'serrja/setupSystem' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: '0.12.15'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare the locked package builder
        run: uv sync --locked --all-groups --no-install-project --python 3.14.7
      - name: Build the allocated Debian package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          make -f mk/package.mk package VERSION="$VERSION" PACKAGE_DIR="$RUNNER_TEMP/debian"
          cd "$RUNNER_TEMP/debian"
          archive="setup-system_${VERSION}_all.deb"
          sha256sum "$archive" > "$archive.sha256"
          cp -- "$archive.sha256" "$RUNNER_TEMP/debian-subjects.sha256"
          dpkg-deb -x "$archive" "$RUNNER_TEMP/package-input"
          cd "$RUNNER_TEMP/package-input/usr/lib/setup-system/plugin_catalog"
          sha256sum -- *.json *.whl >> "$RUNNER_TEMP/debian-subjects.sha256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        id: proof
        with:
          subject-checksums: ${{ runner.temp }}/debian-subjects.sha256
          create-storage-record: false
      - name: Save the signed bundle alongside the package
        env:
          BUNDLE: ${{ steps.proof.outputs.bundle-path }}
          VERSION: ${{ inputs.version }}
        run: cp -- "$BUNDLE" "$RUNNER_TEMP/debian/setup-system_${VERSION}_all.deb.sigstore.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: archive
        with:
          name: debian-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debian/*
          if-no-files-found: error
          compression-level: 0
    outputs:
      artifact: ${{ steps.archive.outputs.artifact-id }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      attestations: read
    concurrency:
      group: debian-publish-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/debian
      - name: Verify the canonical release and publish its Debian companion
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: bash debian/publish "$VERSION" "$RUNNER_TEMP/debian"
