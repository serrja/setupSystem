[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-sdk"
version = "3.0.0"
description = "Contracts, worker runtime and shared tools for setupSystem plugins"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anyio>=4.8,<5",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "keyring>=25,<27",
    "packaging>=24,<27",
    "platformdirs>=4,<5",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8.1,<3",
    "tenacity>=9,<10",
]

[project.optional-dependencies]
ui = ["textual>=2.1,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/setup_system_sdk"]
