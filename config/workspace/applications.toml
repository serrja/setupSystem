[neovim]
kind = "app"
title = "Neovim and Wayland clipboard"
packages = ["neovim", "git", "ripgrep", "fzf", "wl-clipboard", "gcc", "libc6-dev", "tar", "curl"]
[developer_tools]
kind = "app"
title = "Git, GitHub CLI and shell tools"
packages = ["git", "gh", "zsh", "ripgrep", "fzf"]
[codex]
kind = "app"
title = "OpenAI Codex CLI"
packages = ["nodejs", "npm", "git"]
npm = ["@openai/codex"]
[firefox]
kind = "app"
title = "Firefox ESR with strict privacy settings"
packages = ["firefox-esr"]
[happ]
kind = "app"
title = "Happ"
github = "Happ-proxy/happ-desktop"
asset = { amd64 = "Happ.linux.x64.deb", arm64 = "Happ.linux.arm64.deb" }
[chatgpt]
kind = "app"
title = "Official ChatGPT Desktop"
packages = ["chatgpt"]
[obsidian]
kind = "optional"
title = "Obsidian"
github = "obsidianmd/obsidian-releases"
asset = { amd64 = "obsidian_{version}_amd64.deb" }
[telegram]
kind = "optional"
title = "Telegram Desktop"
packages = ["telegram-desktop"]
[docker]
kind = "optional"
title = "Docker Engine and CLI"
packages = ["docker.io", "docker-cli"]
[libreoffice]
kind = "optional"
title = "LibreOffice"
packages = ["libreoffice"]
[python]
kind = "language"
title = "Python, Ruff and basedpyright"
packages = ["pipx", "python3-venv"]
pypi = ["ruff", "basedpyright"]
[typescript_vue]
kind = "language"
title = "TypeScript and Vue"
packages = ["nodejs", "npm"]
npm = ["typescript", "typescript-language-server", "@vue/language-server", "@vue/typescript-plugin", "prettier"]
[dart_flutter]
kind = "language"
title = "Dart and Flutter"
packages = ["git", "curl", "unzip", "xz-utils"]
[cpp]
kind = "language"
title = "C++, clangd and clang-format"
packages = ["clangd", "clang-format"]
