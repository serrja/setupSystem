---
- name: Configure the selected workstation components
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  module_defaults:
    ansible.builtin.uri:
      use_netrc: false
      unredirected_headers: [Authorization]
    ansible.builtin.get_url:
      use_netrc: false
      unredirected_headers: [Authorization]
  vars:
    section: workspace
  tasks:
    - name: Execute the selected local operation
      ansible.builtin.import_tasks: tasks/run.yml
