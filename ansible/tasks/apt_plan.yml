---
- name: Verify the selected APT source trust anchors before staging
  ansible.builtin.command:
    argv: >-
      {{ [ansible_playbook_python, '-I', '-B', playbook_dir + '/files/apt_apply.py', 'sources']
       + (['chatgpt'] if 'chatgpt' in (intent.apps | default([])) else []) }}
  changed_when: false
- name: Create private native APT state on this side of the privilege boundary
  ansible.builtin.tempfile:
    state: directory
    prefix: setup-system-apt-
    path: "{{ '/run/setup-system' if system_run else run_dir }}"
  become: "{{ system_run }}"
  register: apt_work
- name: Allow the unprivileged APT downloader to traverse the protected staging directory
  ansible.builtin.file:
    path: "{{ apt_work.path }}"
    state: directory
    mode: "0711"
  become: true
  when: system_run
- name: Create ephemeral APT indexes and archive directories
  ansible.builtin.file:
    path: "{{ apt_work.path }}/{{ item }}"
    state: directory
    mode: "{{ '0700' if 'partial' in item else '0755' }}"
    owner: "{{ '_apt' if system_run and 'partial' in item else omit }}"
  become: "{{ system_run }}"
  loop: [lists, lists/partial, archives, archives/partial]
- name: Select the signed sources for this operation
  ansible.builtin.set_fact:
    apt:
      - /usr/bin/apt-get
      - -o
      - "Dir::Etc::sourcelist={{ release_root }}/config/base/debian.sources"
      - -o
      - "Dir::Etc::sourceparts={{ release_root + '/config/base/optional_sources' if 'chatgpt' in (intent.apps | default([])) else '-' }}"
      - -o
      - "Dir::Etc::preferences={{ release_root }}/config/base/sources.pref"
      - -o
      - "Dir::State::lists={{ apt_work.path }}/lists"
      - -o
      - "Dir::Cache::archives={{ apt_work.path }}/archives"
      - -o
      - "Dpkg::Options::=--force-confold"
    apt_environment:
      APT_CONFIG: "{{ release_root }}/config/base/apt.conf"
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C
- name: Refresh signed metadata in this run's private indexes
  ansible.builtin.command:
    argv: "{{ apt + ['update', '--error-on=any'] }}"
  register: signed_indexes
  environment: "{{ apt_environment }}"
  become: "{{ system_run }}"
  changed_when: false
- name: Download selected upstream packages with verified SHA-256 into this run
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ apt_work.path }}/{{ item.value.name }}"
    checksum: "{{ item.value.checksum }}"
    mode: "0644"
    validate_certs: true
  become: "{{ system_run }}"
  loop: "{{ latest_debs | dict2items }}"
- name: Inspect verified external Debian package headers
  ansible.builtin.command:
    argv: ["/usr/bin/dpkg-deb", "--show", "--showformat=${Package}|${Architecture}|${Version}", "{{ apt_work.path }}/{{ item.value.name }}"]
  become: "{{ system_run }}"
  loop: "{{ latest_debs | dict2items }}"
  register: deb_headers
  changed_when: false
- name: Check upstream package identity before resolving dependencies
  ansible.builtin.assert:
    that:
      - item.stdout.split('|') | length == 3
      - item.stdout.split('|')[0] == item.item.key
      - item.stdout.split('|')[1] == facts.architecture
      - item.stdout.split('|')[2].split('-')[0] == item.item.value.version
  loop: "{{ deb_headers.results }}"
- name: Verify the exact Happ revision and connection state before accepting an upgrade
  ansible.builtin.command:
    argv: ["{{ ansible_playbook_python }}", "-I", "-B", "{{ playbook_dir }}/files/system_contract.py", "happ-inspect"]
    stdin: "{{ {'settings': intent, 'version': item.stdout.split('|')[2], 'exact': true} | to_json }}"
  loop: "{{ deb_headers.results }}"
  when: item.item.key == 'happ'
  changed_when: false
- name: Collect only verified local archive paths
  ansible.builtin.set_fact:
    local_debs: "{{ local_debs + [apt_work.path + '/' + item.value.name] }}"
  loop: "{{ latest_debs | dict2items }}"
- name: Choose the explicit native package plan
  ansible.builtin.set_fact:
    apt_args: >-
      {{ ([intent.cleanup_mode] + ([] if intent.cleanup_mode == 'autoremove' else ['--'] + cleanup))
         if cleanup else (['--no-remove','--no-install-recommends','install','--'] + packages + local_debs) }}
- name: Simulate the entire selected Debian transaction
  ansible.builtin.command:
    argv: "{{ apt + ['--simulate'] + apt_args }}"
  environment: "{{ apt_environment }}"
  become: "{{ system_run }}"
  register: simulation
  changed_when: false
- name: Freeze dependency closure and reject unconfirmed action types
  ansible.builtin.set_fact:
    apt_changes: "{{ simulation.stdout | native_closure(cleanup | length > 0) }}"
- name: Check the complete removal closure against reviewed metadata
  ansible.builtin.command:
    argv: ["{{ '/usr/bin/python3' if system_run else ansible_playbook_python }}", "-I", "-B", "{{ playbook_dir }}/files/removals.py"]
    stdin: "{{ {'selected': cleanup, 'closure': apt_changes, 'mode': intent.cleanup_mode, 'home': facts.home,
      'xdg': facts.xdg} | to_json
      }}"
  become: "{{ system_run }}"
  when: cleanup | length > 0
  changed_when: false
