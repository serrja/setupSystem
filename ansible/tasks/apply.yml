---
- name: Check cancellation before the next operation
  ansible.builtin.include_tasks: cancel.yml

- name: Prepare the finite system operation inputs
  ansible.builtin.set_fact:
    handoff:
      section: "{{ section }}"
      settings: "{{ intent }}"
      xdg: "{{ facts.xdg }}"
      observed: "{{ boot_facts }}"
      actions: "{{ system_actions }}"
      apt_work: "{{ apt_work.path | default('') }}"

- name: Re-simulate immediately before the system package stage
  ansible.builtin.command:
    argv: "{{ apt + ['--simulate'] + apt_args }}"
  environment: "{{ apt_environment }}"
  register: fresh_apt
  become: true
  changed_when: false
  when: apt_changes | length > 0
- name: Require the same signed install or removal closure
  ansible.builtin.assert:
    that: apt_changes == (fresh_apt.stdout | native_closure(cleanup | length > 0))
  when: apt_changes | length > 0

- name: Check cancellation before the next operation

  ansible.builtin.include_tasks: cancel.yml

- name: Recheck the entire removal and protected package state
  ansible.builtin.command:
    argv: ["/usr/bin/python3", "-I", "-B", "{{ playbook_dir }}/files/removals.py"]
    stdin: "{{ {'selected': cleanup, 'closure': apt_changes, 'mode': intent.cleanup_mode, 'home': facts.home, 'xdg': facts.xdg} | to_json }}"
  register: removals
  become: true
  changed_when: false
  when: cleanup | length > 0 and apt_changes | length > 0
- name: Mark the start of a confirmed system change
  ansible.builtin.set_fact:
    mutation_started: true
  when: cleanup | length > 0 and apt_changes | length > 0
- name: Remove exactly the approved packages using dpkg's dependency checks
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/dpkg', '--purge' if intent.cleanup_mode == 'purge' else '--remove', '--'] + (removals.stdout | from_json) }}"
  become: true
  changed_when: true
  when: cleanup | length > 0 and apt_changes | length > 0

- name: Record protected upstream asset provenance for readback
  ansible.builtin.copy:
    content: "{{ latest_debs | to_json }}"
    dest: "{{ apt_work.path }}/upstream.json"
    mode: "0600"
  become: true
  when: apt_changes | length > 0 and latest_debs | length > 0

- name: Register the native APT pre-install check in the protected staging area
  ansible.builtin.copy:
    content: "{{ apt_changes | to_json }}"
    dest: "{{ apt_work.path }}/approved.json"
    mode: "0600"
  become: true
  when: apt_changes | length > 0 and not cleanup
- name: Stage the native APT transaction for the selected package sources
  ansible.builtin.copy:
    content: "{{ (apt + ['--assume-yes'] + apt_args) | to_json }}"
    dest: "{{ apt_work.path }}/transaction.json"
    mode: "0600"
  become: true
  when: apt_changes | length > 0 and not cleanup

- name: Check cancellation before the next operation

  ansible.builtin.include_tasks: cancel.yml

- name: Mark the start of a confirmed system change
  ansible.builtin.set_fact:
    mutation_started: true
  when: "'plymouth' in system_kinds"
- name: Back up installed boot images before any selected boot package trigger
  ansible.builtin.command:
    argv: ["/usr/bin/python3", "-I", "-B", "{{ playbook_dir }}/files/system_contract.py", "boot"]
    stdin: "{{ handoff | to_json }}"
  become: true
  register: boot_apply
  changed_when: (boot_apply.stdout | from_json).changed
  when: "'plymouth' in system_kinds"
- name: Record the verified boot image
  ansible.builtin.set_fact:
    changed_stages: "{{ changed_stages + [{'kind': 'plymouth', 'label': 'Verified graphical boot image'}] }}"
  when: boot_apply.stdout is defined and (boot_apply.stdout | from_json).changed
- name: Check cancellation before the next operation
  ansible.builtin.include_tasks: cancel.yml

- name: Mark the start of a confirmed system change
  ansible.builtin.set_fact:
    mutation_started: true
  when: apt_changes | length > 0 and not cleanup and not (boot_facts.unlock.packages | default([]))
- name: Apply the native, signed Debian transaction with service start deferral
  ansible.builtin.command:
    argv: ["/usr/bin/python3", "-I", "-B", "{{ playbook_dir }}/files/apt_apply.py", "apply", "{{ apt_work.path }}"]
  become: true
  changed_when: true
  when: apt_changes | length > 0 and not cleanup and not (boot_facts.unlock.packages | default([]))
- name: Verify that the native transaction now has no pending package changes
  ansible.builtin.command:
    argv: "{{ apt + ['--simulate'] + apt_args }}"
  environment: "{{ apt_environment }}"
  become: true
  changed_when: false
  register: installed
  failed_when: installed.rc != 0 or (installed.stdout | native_closure(cleanup | length > 0) | length > 0)
  when: apt_changes | length > 0
- name: Record verified package changes
  ansible.builtin.set_fact:
    changed_stages: "{{ changed_stages + [{'kind': 'packages_verified', 'label': 'Verified Debian package transaction'}] }}"
  when: apt_changes | length > 0

- name: Check cancellation before the next operation

  ansible.builtin.include_tasks: cancel.yml

- name: Verify the installed Happ unit and preserve administrator masks
  ansible.builtin.command:
    argv: ["/usr/bin/python3", "-I", "-B", "{{ playbook_dir }}/files/system_contract.py", "happ-unit"]
    stdin: "{{ handoff | to_json }}"
  become: true
  changed_when: false
  when: "'happ_start' in system_kinds"
- name: Mark the start of the approved vendor service change
  ansible.builtin.set_fact:
    mutation_started: true
  when: "'happ_start' in system_kinds"
- name: Start the verified vendor service after the Debian transaction
  ansible.builtin.systemd_service:
    name: happd.service
    daemon_reload: true
    state: started
  become: true
  when: "'happ_start' in system_kinds"
- name: Check the vendor service completed its start
  ansible.builtin.command:
    argv: ["/usr/bin/systemctl", "--system", "--quiet", "is-active", "happd.service"]
  changed_when: false
  when: "'happ_start' in system_kinds"
- name: Record the verified vendor service
  ansible.builtin.set_fact:
    changed_stages: "{{ changed_stages + [{'kind': 'happ_start', 'label': 'Started the installed Happ service'}] }}"
  when: "'happ_start' in system_kinds"
- name: Check cancellation before the next operation
  ansible.builtin.include_tasks: cancel.yml
- name: Mark the start of a confirmed system change
  ansible.builtin.set_fact:
    mutation_started: true
  when: section == 'base' and 'region' in system_kinds
- name: Apply reviewed regional changes
  ansible.builtin.command:
    argv: ["/usr/bin/python3", "-I", "-B", "{{ playbook_dir }}/files/system_contract.py", "region"]
    stdin: "{{ handoff | to_json }}"
  become: true
  changed_when: true
  when: section == 'base' and 'region' in system_kinds
- name: Record completed regional changes
  ansible.builtin.set_fact:
    changed_stages: "{{ changed_stages + (system_actions | selectattr('kind', 'equalto', 'region') | list) }}"
  when: section == 'base'

- name: Check cancellation before the next operation

  ansible.builtin.include_tasks: cancel.yml
- name: Verify compatible Debian desktop binaries before writing user configuration
  ansible.builtin.command:
    argv: ["{{ ansible_playbook_python }}", "-I", "-B", "{{ playbook_dir }}/files/facts.py", "desktop-ready"]
  changed_when: false
  when: user_changes | length > 0 and (intent.hyprland | default(false) or intent.desktop_theme | default(false) or intent.monitors | default([]))
- name: Apply signed-off user settings and developer tools without become
  ansible.builtin.include_tasks: user_apply.yml
  when: user_changes | length > 0
- name: Check cancellation before the next operation
  ansible.builtin.include_tasks: cancel.yml

- name: Mark the start of a confirmed system change
  ansible.builtin.set_fact:
    mutation_started: true
  when: "'graphical_login' in system_kinds"
- name: Apply the confirmed graphical login after verifying the user launcher
  ansible.builtin.command:
    argv: ["/usr/bin/python3", "-I", "-B", "{{ playbook_dir }}/files/system_contract.py", "login"]
    stdin: "{{ handoff | to_json }}"
  become: true
  register: login_apply
  changed_when: (login_apply.stdout | from_json).changed
  when: "'graphical_login' in system_kinds"
- name: Record completed login changes
  ansible.builtin.set_fact:
    changed_stages: "{{ changed_stages + [{'kind': 'graphical_login', 'label': 'Enabled greetd'}] }}"
  when: login_apply.stdout is defined and (login_apply.stdout | from_json).changed
- name: Check cancellation before the next operation
  ansible.builtin.include_tasks: cancel.yml

- name: Mark the start of a confirmed system change
  ansible.builtin.set_fact:
    mutation_started: true
  when: "'firefox_policy' in system_kinds"
- name: Verify the selected Firefox privacy policy
  ansible.builtin.command:
    argv: ["/usr/bin/python3", "-I", "-B", "{{ playbook_dir }}/files/system_contract.py", "firefox"]
    stdin: "{{ handoff | to_json }}"
  become: true
  changed_when: true
  when: "'firefox_policy' in system_kinds"
- name: Record completed independent operations
  ansible.builtin.set_fact:
    changed_stages: "{{ changed_stages + ([{'kind': 'firefox_policy', 'label': 'Applied Firefox enterprise privacy policy'}] if 'firefox_policy' in
      system_kinds else []) }}"
    notices: >-
      {{ [{'kind': 'login_required', 'label': 'Finish sign-in or subscription setup in the selected application'}]
         if ['chatgpt', 'happ'] | intersect(intent.apps | default([])) else [] }}
