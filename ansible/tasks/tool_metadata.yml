---
- name: Read the selected package manager's official latest release
  ansible.builtin.uri:
    url: >-
      {{ 'https://registry.npmjs.org/' + (tool[0] | urlencode)
         + ('' if tool[0] in editor_catalog.npm_compatible_series else '/latest') if tool[1] == 'npm' else 'https://pypi.org/pypi/' + tool[0] + '/json' }}
    headers:
      Accept: "{{ 'application/vnd.npm.install-v1+json' if tool[0] in editor_catalog.npm_compatible_series else 'application/json' }}"
    return_content: true
    validate_certs: true
    follow_redirects: none
    timeout: 35
  register: metadata
- name: Select the latest stable release compatible with the native runtime
  ansible.builtin.set_fact:
    release_meta: "{{ metadata.json | registry_release(tool[0], editor_catalog.npm_compatible_series) }}"
- name: Identify the stable named upstream package
  ansible.builtin.set_fact:
    version: "{{ release_meta.version if tool[1] == 'npm' else release_meta.info.version }}"
    current_version: "{{ facts.xdg.data | managed_version(tool[1], tool[0]) }}"
- name: Check the trusted package name and release
  ansible.builtin.assert:
    that:
      - (release_meta.name if tool[1] == 'npm' else release_meta.info.name) | lower == tool[0]
      - version is match('^[0-9]+([.][0-9]+){1,3}$')
- name: Preserve the metadata selected at confirmation
  ansible.builtin.set_fact:
    latest_tools: >-
      {{ latest_tools | combine({tool[0]: {'manager':tool[1],'current':current_version,'version':version,
         'artifact': release_meta | package_artifact(tool[0], tool[1], version)}}) }}
    user_changes: >-
      {{ user_changes + ([{'kind': 'tool', 'name': tool[0], 'version': version, 'label': 'Install ' + tool[0] + ' ' + version}]
         if current_version  != version else []) }}
