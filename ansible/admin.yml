---
- name: Inspect or grant one existing local user's administrative access
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  become_method: ansible.builtin.su
  become_user: root
  vars:
    ansible_su_exe: /usr/bin/su
    ansible_su_flags: --shell /bin/sh
    request_file: "{{ lookup('ansible.builtin.env', 'SETUP_SYSTEM_REQUEST') }}"
    cancel_file: "{{ lookup('ansible.builtin.env', 'SETUP_SYSTEM_CANCEL') }}"
    result_file: "{{ lookup('ansible.builtin.env', 'SETUP_SYSTEM_RESULT') }}"
  tasks:
    - name: Select the fixed administrative operation
      ansible.builtin.assert:
        that: setup_action in ['inspect', 'plan', 'apply']

    - name: Freeze the bounded administrative request as the caller
      block:
        - name: Require the pre-prompt identity for Apply
          ansible.builtin.assert:
            that: admin_request_sha is defined and admin_request_sha is string
          when: setup_action == 'apply'

        - name: Verify the file, target, consent and pre-prompt identity
          ansible.builtin.set_fact:
            payload: "{{ request_file | native_admin_request(setup_action, admin_request_sha | default(none)) }}"
      rescue:
        - name: Reject invalid administrative input before privilege
          ansible.builtin.set_fact:
            outcome:
              status: blocked
              blockers: ["Invalid or changed administrative request. Preview a new account plan."]

    - name: Inspect the selected login without privilege
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "-I", "-B", "{{ playbook_dir }}/files/admin.py", "account", "{{ setup_action }}"]
        stdin: "{{ payload.wire }}"
      register: probe
      changed_when: false
      when: setup_action != 'apply' and outcome is not defined

    - name: Keep the inspected account and planned group change
      ansible.builtin.set_fact:
        outcome: "{{ probe.stdout | from_json }}"
      when: setup_action != 'apply' and outcome is not defined

    - name: Confirm that su can authenticate before attempting an account change
      when: setup_action == 'apply' and outcome is not defined and cancel_file is not file
      block:
        - name: Probe the root session without changing local state
          ansible.builtin.raw: /usr/bin/true
          become: true
          register: authentication
          no_log: true
          changed_when: false
          ignore_unreachable: true
        - name: Require a successful read-only probe
          ansible.builtin.assert:
            that: authentication.rc | default(1) == 0 and not (authentication.unreachable | default(false))
      rescue:
        - name: Report an unavailable root session before the grant
          ansible.builtin.set_fact:
            outcome:
              status: blocked
              blockers: ["Root authentication via su/PAM was unavailable. Check the root account with an authorized administrator."]

    - name: Report cancellation before the administrative transaction
      ansible.builtin.set_fact:
        outcome:
          status: cancelled
          blockers: ["Cancelled before the account change."]
      when: setup_action == 'apply' and outcome is not defined and cancel_file is file

    - name: Revalidate and append through the installed account adapter
      when: setup_action == 'apply' and outcome is not defined
      block:
        - name: Attempt the confirmed append once using the same become credential
          # Raw executes the root-owned helper directly. No Python module is staged under HOME.
          ansible.builtin.raw: >-
            /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C HOME=/root
            /usr/bin/python3 -I -S -B
            -c 'import runpy, sys; sys.path.append("/usr/lib/python3/dist-packages");
            from setup_system.layout import INSTALLED, require_installed_resource;
            relative = "ansible/files/admin.py"; source = INSTALLED / relative; require_installed_resource(source, relative);
            runpy.run_path(str(source), run_name="__main__")'
            account apply
            {{ payload.wire | quote }}
          become: true
          register: grant
          no_log: true
          changed_when: false
          ignore_unreachable: true

        - name: Require a response from the packaged account operation
          ansible.builtin.assert:
            that: grant.rc | default(1) == 0 and not (grant.unreachable | default(false))

        - name: Decode the typed administrative result
          ansible.builtin.set_fact:
            grant_reply: "{{ grant.stdout | native_result }}"

        - name: Check the final status and confirmed account identity
          vars:
            expected: "{{ (payload.wire | from_json).expected.observed }}"
          ansible.builtin.assert:
            that:
              - grant_reply.status in ['requires_user_login', 'partial', 'blocked']
              - >-
                (grant_reply.observed.account == (expected.account | combine({'member': true}))
                 and grant_reply.observed.boot_identity == expected.boot_identity)
                if grant_reply.status == 'requires_user_login' else (grant_reply.blockers | default([]) | length > 0)
        - name: Record the verified account outcome
          ansible.builtin.set_fact:
            outcome: "{{ grant_reply }}"
      rescue:
        - name: Report an unverified result after the grant was attempted
          ansible.builtin.set_fact:
            outcome:
              status: unknown
              blockers: ["The grant returned no verifiable outcome. Inspect the account and sudo policy before another Apply."]

    - name: Publish the result as the caller
      ansible.builtin.copy:
        content: "{{ outcome | to_json }}\n"
        dest: "{{ result_file }}"
        mode: "0600"
