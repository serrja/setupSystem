---
- name: Apply the confirmed Snap catalog selection
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check publisher identities and change the exact approved revisions
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.raw: >-
        /usr/bin/printf %s '{{ setup_system_payload }}' |
        /usr/bin/base64 --decode |
        /usr/bin/python3 -I -B /usr/lib/setup-system/plugins/snap/setup_plugin_snap/privileged.py
      changed_when: true
