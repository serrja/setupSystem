[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-zsh"
version = "2.0.0"
requires-python = ">=3.12"
description = "Maintain Zsh startup fragments and preserve the existing login shell and history."
dependencies = ["setup-system-sdk>=3,<4"]

[project.entry-points."setup_system.plugins"]
zsh = "setup_plugin_zsh.plugin:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_zsh"]

[tool.setup-system.manifest]
name = "Zsh"
author = "serrja"
category = "applications"
kind = "application"
sdk = ">=3,<4"
source = "https://github.com/serrja/setupSystem"
permissions = ["user-files", "root"]
capabilities = []
dependencies = []
pages = []

[[tool.setup-system.manifest.actions]]
id = "check"
label = "Check Zsh"
mode = "read_only"

[[tool.setup-system.manifest.actions]]
id = "install"
label = "Install Zsh"
target = "install"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "update"
label = "Update Zsh"
target = "update"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
cleanup_phase = "program"
id = "uninstall"
label = "Uninstall Zsh"
target = "uninstall"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "configure"
label = "Configure Zsh"
target = "configure"
permissions = ["user-files"]
mode = "mutation"

[[tool.setup-system.manifest.actions]]
id = "verify-startup"
label = "Verify Zsh startup modes"
mode = "read_only"
