[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-git"
version = "1.0.0"
requires-python = ">=3.12"
description = "Git workstation plugin"
license = "MIT"
dependencies = ["setup-system>=0.6.0.dev0", "pydantic>=2.10,<3", "cryptography>=44", "httpx>=0.27,<1"]

[project.entry-points."setup_system.plugins"]
git = "setup_plugin_git:Plugin"

[project.entry-points."setup_system.plugin_ui"]
git = "setup_plugin_git.ui:GitPanel"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_git"]
