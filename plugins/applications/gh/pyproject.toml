[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-gh"
version = "1.0.0"
requires-python = ">=3.12"
description = "GitHub CLI workstation plugin"
license = "MIT"
dependencies = ["setup-system>=0.6.0.dev0", "pydantic>=2.10,<3", "pyyaml>=6,<7", "httpx>=0.27,<1"]

[project.entry-points."setup_system.plugins"]
gh = "setup_plugin_gh:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_gh"]
