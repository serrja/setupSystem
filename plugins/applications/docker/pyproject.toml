[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-docker"
version = "1.0.0"
requires-python = ">=3.12"
description = "Docker workstation plugin"
license = "MIT"
dependencies = ["setup-system>=0.6.0.dev0", "pydantic>=2.10,<3"]

[project.entry-points."setup_system.plugins"]
docker = "setup_plugin_docker:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_docker"]
