[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-zsh"
version = "1.0.0"
requires-python = ">=3.12"
description = "Maintain Zsh startup fragments and preserve the existing login shell and history."
dependencies = ["setup-system>=0.6.0.dev0"]

[project.entry-points."setup_system.plugins"]
zsh = "setup_plugin_zsh:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_zsh"]
