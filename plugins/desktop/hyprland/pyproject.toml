[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-hyprland"
version = "1.0.0"
requires-python = ">=3.12"
description = "Hyprland desktop configuration"
license = "MIT"
dependencies = ["setup-system>=0.6.0.dev0"]

[project.entry-points."setup_system.plugins"]
hyprland = "setup_plugin_hyprland:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_hyprland"]
