[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-waybar"
version = "1.0.1"
requires-python = ">=3.12"
description = "Waybar desktop configuration"
license = "MIT"
dependencies = ["setup-system>=0.6.0.dev0"]

[project.entry-points."setup_system.plugins"]
waybar = "setup_plugin_waybar:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_waybar"]
