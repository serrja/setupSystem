---
- name: Publish reviewed Firefox policy
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Validate the sealed approval in the protected interpreter
      become: true
      ansible.builtin.raw: >-
        /usr/bin/printf %s '{{ setup_system_payload }}' | /usr/bin/base64 --decode |
        /usr/bin/python3 -I -B /usr/lib/setup-system/plugins/firefox/setup_plugin_firefox/privileged.py
      changed_when: true
