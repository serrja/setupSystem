[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-firefox"
version = "2.0.0"
requires-python = ">=3.12"
description = "Firefox ESR workstation plugin"
license = "MIT"
dependencies = ["setup-system-sdk>=3,<4", "pydantic>=2.10,<3"]

[project.entry-points."setup_system.plugins"]
firefox = "setup_plugin_firefox.plugin:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_firefox"]

[tool.setup-system.manifest]
name = "Firefox ESR"
author = "serrja"
category = "applications"
kind = "application"
sdk = ">=3,<4"
source = "https://github.com/serrja/setupSystem"
permissions = ["root"]
capabilities = ["enterprise-policy", "tracking-protection"]
dependencies = []
pages = ["Overview", "Settings", "Actions", "Managed resources", "History", "Help"]

[[tool.setup-system.manifest.actions]]
id = "install"
label = "Install"
target = "install"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "update"
label = "Update"
target = "update"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
cleanup_phase = "program"
id = "uninstall"
label = "Uninstall"
target = "uninstall"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "check"
label = "Check Firefox"
mode = "read_only"

[[tool.setup-system.manifest.actions]]
id = "configure"
label = "Configure privacy policy"
target = "configure"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.platform"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
cleanup_phase = "local"
id = "remove-policy"
label = "Remove generated policy"
target = "remove-policy"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.platform"
version = ">=1,<2"
