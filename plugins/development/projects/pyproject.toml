[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-projects"
version = "1.0.1"
requires-python = ">=3.12"
description = "Canonical project catalog and Copier workflows"
license = "MIT"
dependencies = ["setup-system>=0.6.0.dev0"]

[project.optional-dependencies]
templates = ["copier>=9.10,<10"]

[project.entry-points."setup_system.plugins"]
projects = "setup_plugin_projects:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_projects"]
