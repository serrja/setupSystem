[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-cpp"
version = "1.0.0"
requires-python = ">=3.12"
description = "C++ tools workstation tools"
license = "MIT"
dependencies = ["setup-system>=0.6.0.dev0"]

[project.entry-points."setup_system.plugins"]
cpp = "setup_plugin_cpp:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_cpp"]
