---
- name: Authenticate and revalidate one confirmed sudo grant
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run the installed grant with root authentication
      become: true
      become_method: ansible.builtin.su
      # A fixed raw invocation avoids staging a user-owned Python module for become.
      ansible.builtin.raw: >-
        /usr/bin/printf %s {{ setup_system_payload }} |
        /usr/bin/base64 --decode |
        /usr/bin/python3 -I -B /usr/lib/setup-system/plugins/administration/setup_plugin_administration/adapters/entrypoint.py grant-sudo
      changed_when: true
