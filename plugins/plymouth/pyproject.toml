[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-plymouth"
version = "2.0.0"
requires-python = ">=3.12"
description = "Plymouth graphical prompt with recovery"
license = "MIT"
dependencies = ["setup-system-desktop-theme>=1,<2", "setup-system-sdk>=3,<4"]

[project.entry-points."setup_system.plugins"]
plymouth = "setup_plugin_plymouth.plugin:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_plymouth"]

[tool.setup-system.manifest]
name = "Plymouth"
author = "serrja"
category = "system"
kind = "system"
sdk = ">=3,<4"
source = "https://github.com/serrja/setupSystem"
permissions = ["root"]
capabilities = ["initramfs-prompt"]
dependencies = ["regional"]
pages = []

[[tool.setup-system.manifest.actions]]
id = "check"
label = "Check"
mode = "read_only"
[[tool.setup-system.manifest.actions.requires]]
id = "system.platform"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "install"
label = "Install"
target = "install"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"
[[tool.setup-system.manifest.actions.requires]]
id = "system.platform"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "update"
label = "Update"
target = "update"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"
[[tool.setup-system.manifest.actions.requires]]
id = "system.platform"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "configure"
label = "Configure"
target = "configure"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.platform"
version = ">=1,<2"
