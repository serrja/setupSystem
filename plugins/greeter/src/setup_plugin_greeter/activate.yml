---
- name: Apply a confirmed workstation setting
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Revalidate and apply the installed native operation
      become: true
      become_method: ansible.builtin.sudo
      # A fixed raw invocation avoids staging a user-owned Python module for become.
      ansible.builtin.raw: >-
        /usr/bin/printf %s {{ setup_system_payload }} |
        /usr/bin/base64 --decode |
        /usr/bin/python3 -I -B /usr/lib/setup-system/plugins/greeter/setup_plugin_greeter/native.py
      changed_when: true
