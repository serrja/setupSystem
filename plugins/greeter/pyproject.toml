[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-greeter"
version = "2.0.0"
requires-python = ">=3.12"
description = "Graphical login and recovery"
license = "MIT"
dependencies = ["setup-system-sdk>=3,<4"]

[project.entry-points."setup_system.plugins"]
greeter = "setup_plugin_greeter.plugin:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_greeter"]

[tool.setup-system.manifest]
name = "Greeter"
author = "serrja"
category = "desktop"
kind = "system"
sdk = ">=3,<4"
source = "https://github.com/serrja/setupSystem"
permissions = ["root"]
capabilities = ["login-manager"]
dependencies = ["hyprland"]
pages = []

[[tool.setup-system.manifest.actions]]
id = "check"
label = "Check program"
mode = "read_only"

[[tool.setup-system.manifest.actions]]
id = "install"
label = "Install"
target = "install"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "update"
label = "Update"
target = "update"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "uninstall"
label = "Uninstall"
target = "uninstall"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "activate-login"
label = "Activate graphical login"
target = "activate-login"
permissions = ["root"]
mode = "mutation"
