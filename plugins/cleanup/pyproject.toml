[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-cleanup"
version = "2.0.0"
requires-python = ">=3.12"
description = "Remove reviewed Debian packages safely"
license = "MIT"
dependencies = ["setup-system-sdk>=3,<4"]

[project.entry-points."setup_system.plugins"]
cleanup = "setup_plugin_cleanup.plugin:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_cleanup"]

[tool.setup-system.manifest]
name = "Cleanup"
author = "serrja"
category = "system"
kind = "system"
sdk = ">=3,<4"
source = "https://github.com/serrja/setupSystem"
permissions = ["root", "remove-preexisting"]
capabilities = ["apt-removal"]
dependencies = []
pages = []

[[tool.setup-system.manifest.actions]]
id = "remove"
label = "Remove"
target = "remove"
permissions = ["root", "remove-preexisting"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.package-cleanup"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "purge"
label = "Purge"
target = "purge"
permissions = ["root", "remove-preexisting"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.package-cleanup"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "autoremove"
label = "Autoremove"
target = "autoremove"
permissions = ["root", "remove-preexisting"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.package-cleanup"
version = ">=1,<2"
