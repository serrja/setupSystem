[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-cleanup"
version = "2.0.0"
requires-python = ">=3.12"
description = "Remove reviewed Debian packages safely"
license = "MIT"
dependencies = ["setup-system>=0.7.0.dev0"]

[project.entry-points."setup_system.plugins"]
cleanup = "setup_plugin_cleanup.plugin:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_cleanup"]
