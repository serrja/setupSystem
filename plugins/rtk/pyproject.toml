[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-rtk"
version = "2.0.0"
requires-python = ">=3.12"
description = "Verify and install the official RTK binary in the current account."
dependencies = ["setup-system-sdk>=3,<4"]

[project.entry-points."setup_system.plugins"]
rtk = "setup_plugin_rtk.plugin:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_rtk"]

[tool.setup-system.manifest]
name = "RTK"
author = "serrja"
category = "applications"
kind = "application"
sdk = ">=3,<4"
source = "https://github.com/serrja/setupSystem"
permissions = ["user-files"]
capabilities = []
dependencies = []
pages = []

[[tool.setup-system.manifest.actions]]
id = "check"
label = "Check RTK"
mode = "read_only"

[[tool.setup-system.manifest.actions]]
id = "install"
label = "Install RTK"
target = "install"
permissions = ["user-files"]
mode = "mutation"

[[tool.setup-system.manifest.actions]]
id = "update"
label = "Update RTK"
target = "update"
permissions = ["user-files"]
mode = "mutation"

[[tool.setup-system.manifest.actions]]
cleanup_phase = "program"
id = "uninstall"
label = "Uninstall owned RTK binary"
target = "uninstall"
permissions = ["user-files"]
mode = "mutation"
