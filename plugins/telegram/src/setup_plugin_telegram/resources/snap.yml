---
- name: Install or remove the reviewed official Telegram snap
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Revalidate the signed revision, shared runtimes and snapshot policy
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.raw: >-
        /usr/bin/printf %s '{{ setup_system_payload }}' |
        /usr/bin/base64 --decode |
        /usr/bin/python3 -I -B /usr/lib/setup-system/plugins/telegram/setup_plugin_telegram/snaps.py
      changed_when: true
