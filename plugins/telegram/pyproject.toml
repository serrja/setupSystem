[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-telegram"
version = "2.0.0"
requires-python = ">=3.12"
description = "Telegram Desktop workstation plugin"
license = "MIT"
dependencies = ["setup-system-sdk>=3,<4", "setup-system-desktop-theme>=1,<2", "httpx>=0.27,<1", "pyyaml>=6,<7"]

[project.entry-points."setup_system.plugins"]
telegram = "setup_plugin_telegram:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_telegram"]

[tool.setup-system.manifest]
name = "Telegram Desktop"
author = "serrja"
category = "applications"
kind = "application"
sdk = ">=3,<4"
source = "https://github.com/serrja/setupSystem"
permissions = ["root", "user-files"]
capabilities = ["snap-package"]
dependencies = ["snap"]
pages = ["Overview", "Settings", "Accounts", "Actions", "Managed resources", "History", "Help"]

[[tool.setup-system.manifest.actions]]
id = "install"
label = "Install"
target = "install"
permissions = ["root"]
page = "actions"
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"
[[tool.setup-system.manifest.actions.requires]]
id = "system.platform"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "update"
label = "Update"
target = "update"
permissions = ["root"]
page = "actions"
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"
[[tool.setup-system.manifest.actions.requires]]
id = "system.platform"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "uninstall"
label = "Uninstall"
target = "uninstall"
cleanup_phase = "program"
permissions = ["root"]
page = "actions"
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"
[[tool.setup-system.manifest.actions.requires]]
id = "system.platform"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "check"
label = "Check Telegram Desktop"
page = "actions"
mode = "read_only"

[[tool.setup-system.manifest.actions]]
id = "accounts"
label = "Accounts"
page = "accounts"
mode = "manual"

[[tool.setup-system.manifest.actions]]
id = "notifications"
label = "Notifications"
page = "actions"
mode = "manual"

[[tool.setup-system.manifest.actions]]
id = "configure-launcher"
label = "Save application launcher"
target = "configure-launcher"
permissions = ["user-files"]
supports_rollback = true
page = "actions"
mode = "mutation"

[[tool.setup-system.manifest.actions]]
id = "remove-debian-package"
label = "Remove previously managed Debian package"
target = "remove-debian-package"
cleanup_phase = "program"
description = "Remove the exact Debian telegram-desktop package recorded before switching to Snap. APT preserves user data."
permissions = ["root"]
page = "actions"
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"
