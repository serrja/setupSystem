[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-happ"
version = "2.0.0"
requires-python = ">=3.12"
description = "Happ workstation plugin"
license = "MIT"
dependencies = ["setup-system-sdk>=3,<4", "pydantic>=2.10,<3"]

[project.entry-points."setup_system.plugins"]
happ = "setup_plugin_happ.plugin:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_happ"]

[tool.setup-system.manifest]
name = "Happ"
author = "serrja"
category = "applications"
kind = "application"
sdk = ">=3,<4"
source = "https://github.com/serrja/setupSystem"
permissions = ["user-files", "root"]
capabilities = ["subscriptions", "routing-export"]
dependencies = []
pages = ["Overview", "Settings", "Actions", "Managed resources", "History", "Help"]

[[tool.setup-system.manifest.actions]]
id = "check"
label = "Check Happ"
mode = "read_only"

[[tool.setup-system.manifest.actions]]
id = "save-subscription"
label = "Save subscription details"
page = "accounts"
target = "save-subscription"
permissions = ["user-files"]
mode = "mutation"

[[tool.setup-system.manifest.actions]]
id = "import"
label = "Import in Happ"
page = "accounts"
mode = "manual"

[[tool.setup-system.manifest.actions]]
id = "update-subscription"
label = "Refresh in Happ"
page = "accounts"
mode = "manual"

[[tool.setup-system.manifest.actions]]
id = "remove-subscription"
label = "Remove in Happ"
page = "accounts"
mode = "manual"

[[tool.setup-system.manifest.actions]]
id = "export-route"
label = "Add or move a route rule"
target = "export-route"
permissions = ["user-files"]
mode = "mutation"

[[tool.setup-system.manifest.actions]]
id = "reconnect"
label = "Reconnect in Happ"
mode = "manual"

[[tool.setup-system.manifest.actions]]
id = "install"
label = "Install"
target = "install"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "update"
label = "Update"
target = "update"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
cleanup_phase = "program"
id = "uninstall"
label = "Uninstall"
target = "uninstall"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "start-system-service"
label = "Start Happ service"
target = "start-system-service"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "stop-system-service"
label = "Stop Happ service"
target = "stop-system-service"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "forget-local"
label = "Forget local subscription records"
target = "forget-local"
permissions = ["user-files"]
mode = "mutation"

[[tool.setup-system.manifest.actions]]
cleanup_phase = "local"
id = "forget-owned-files"
label = "Forget managed subscriptions"
target = "forget-owned-files"
permissions = ["user-files"]
mode = "mutation"
