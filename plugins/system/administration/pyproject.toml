[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-administration"
version = "1.0.1"
requires-python = ">=3.12"
description = "Grant sudo access to an existing local login"
license = "MIT"
dependencies = ["setup-system>=0.6.0.dev0"]

[project.entry-points."setup_system.plugins"]
administration = "setup_plugin_administration:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_administration"]
