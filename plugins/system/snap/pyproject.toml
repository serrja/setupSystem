[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-snap"
version = "1.0.0"
requires-python = ">=3.12"
description = "Manage the Debian Snap runtime and inspect installed revisions"
license = "MIT"
dependencies = ["setup-system>=0.6.0.dev0", "httpx>=0.27,<1", "pydantic>=2.10,<3"]

[project.entry-points."setup_system.plugins"]
snap = "setup_plugin_snap:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_snap"]
