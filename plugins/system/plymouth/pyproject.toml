[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-plymouth"
version = "1.0.1"
requires-python = ">=3.12"
description = "Plymouth graphical prompt with recovery"
license = "MIT"
dependencies = ["setup-system>=0.6.0.dev0"]

[project.entry-points."setup_system.plugins"]
plymouth = "setup_plugin_plymouth:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_plymouth"]
