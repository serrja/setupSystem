[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setup-system-plugin-hyprland"
version = "2.0.0"
requires-python = ">=3.12"
description = "Hyprland desktop configuration"
license = "MIT"
dependencies = ["setup-system-desktop-theme>=1,<2", "setup-system-sdk>=3,<4"]

[project.entry-points."setup_system.plugins"]
hyprland = "setup_plugin_hyprland.plugin:Plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_plugin_hyprland"]

[tool.setup-system.manifest]
session_fields = ["HYPRLAND_INSTANCE_SIGNATURE"]
name = "Hyprland"
author = "serrja"
category = "desktop"
kind = "system"
sdk = ">=3,<4"
source = "https://github.com/serrja/setupSystem"
permissions = ["root", "user-files", "session-output"]
capabilities = []
dependencies = ["foot", "waybar", "hyprlock", "regional"]
pages = []

[[tool.setup-system.manifest.actions]]
id = "check"
label = "Check program"
mode = "read_only"

[[tool.setup-system.manifest.actions]]
id = "install"
label = "Install"
target = "install"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "update"
label = "Update"
target = "update"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
cleanup_phase = "program"
id = "uninstall"
label = "Uninstall"
target = "uninstall"
permissions = ["root"]
mode = "mutation"
[[tool.setup-system.manifest.actions.requires]]
id = "system.packages"
version = ">=1,<2"

[[tool.setup-system.manifest.actions]]
id = "configure"
label = "Save configuration"
target = "configure"
permissions = ["user-files"]
supports_rollback = true
mode = "mutation"

[[tool.setup-system.manifest.actions]]
id = "save-monitor"
label = "Save monitor layout"
target = "save-monitor"
permissions = ["user-files"]
supports_rollback = true
mode = "mutation"

[[tool.setup-system.manifest.actions]]
id = "test-monitor"
label = "Test monitor temporarily"
target = "test-monitor"
permissions = ["session-output"]
mode = "mutation"
description = "Restore the original output after twelve seconds."
