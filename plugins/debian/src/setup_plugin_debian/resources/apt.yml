---
- name: Install the approved plugin package closure
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Validate the sealed approval in the protected interpreter
      become: true
      ansible.builtin.raw: >-
        /usr/bin/printf %s '{{ setup_system_payload }}' | /usr/bin/base64 --decode |
        /var/lib/setup-system/active/native/bin/python -I -B -m setup_plugin_debian.adapters.apt apply
      changed_when: true
